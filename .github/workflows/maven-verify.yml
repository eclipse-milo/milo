name: Run `mvn verify` on JDK 17 on Linux and Windows
permissions:
  contents: read

on:
  pull_request:
    branches:
      - "main"
      - "integration/1.2"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Verify with Maven
        run: mvn -B verify
